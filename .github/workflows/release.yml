  #         VERSION="${GITHUB_REF_NAME#v}"
  #         sha256sum "coordinate-${VERSION}-windows-x64.exe" > "coordinate-${VERSION}-windows-x64.exe.sha256"

  release:
    name: attach to the GitHub Release
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Build the wheel and sdist
        run: uv build

      - name: Checksums
        run: |
          cd dist
          sha256sum -- ./*.whl ./*.tar.gz > SHA256SUMS
          cat SHA256SUMS

      - name: Download the binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: coordinate-binaries-*
          merge-multiple: true

      - name: Verify binary checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c -- ./SHA256SUMS-binaries
          ls -la

      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS-binaries
            dist/coordinate-*
          generate_release_notes: true
