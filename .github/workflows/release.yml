name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  SCRIPTC_VERSION: "0.4.16"

jobs:
  # scriptc binaries for the TS port. One ubuntu job cross-compiles the macOS
  # targets with zig (SCRIPTC_TARGET plus the @scriptc/runtime-darwin-arm64
  # pack, per scriptc docs/platforms) so no macOS runners are needed; the
  # darwin binaries are not runnable on Linux, so they only get a file-type
  # check. linux-x64-musl is the --static link. Build commands match the
  # spike (see .agents/docs/ts-port-spike.md, all figures (M) there).
  binaries:
    name: scriptc binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: mlugg/setup-zig@v2
        with:
          # scriptc invokes `zig cc` for cross-target links; zig >= 0.15
          # dropped that driver (see .agents/docs/windows-spike.md)
          version: 0.14.1

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@12.16.1 --activate

      - name: Install scriptc ${{ env.SCRIPTC_VERSION }}
        run: npm install -g scriptc@${{ env.SCRIPTC_VERSION }}

      - name: Install ts dependencies
        working-directory: ts
        run: |
          pnpm add -D @scriptc/runtime-darwin-arm64@${{ env.SCRIPTC_VERSION }}
          pnpm install --frozen-lockfile=false

      - name: Build Linux binaries
        working-directory: ts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          scriptc build main-elf.ts \
            --npm-static @cutils/sqlite,@cutils/cli \
            --ffi node_modules/@cutils/sqlite/ffi.json \
            -o "../coordinate-${VERSION}-linux-x64-gnu"
          scriptc build main-elf.ts \
            --npm-static @cutils/sqlite,@cutils/cli \
            --ffi node_modules/@cutils/sqlite/ffi.json \
            --static \
            -o "../coordinate-${VERSION}-linux-x64-musl"

      - name: Smoke test Linux binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          "./coordinate-${VERSION}-linux-x64-gnu" --help
          "./coordinate-${VERSION}-linux-x64-musl" --help

      - name: Build darwin-arm64 (cross-compiled, not runnable here)
        working-directory: ts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./build-darwin-sqlite.sh arm64
          cp node_modules/@cutils/sqlite/build-arm64/libsqlite3-shim.a \
            node_modules/@cutils/sqlite/build/libsqlite3-shim.a
          SCRIPTC_TARGET=arm64-apple-macosx14.0.0 \
            scriptc build main-elf.ts \
            --npm-static @cutils/sqlite,@cutils/cli \
            --ffi node_modules/@cutils/sqlite/ffi.json \
            -o "../coordinate-${VERSION}-darwin-arm64"

      - name: Build darwin-x64 (cross-compiled, not runnable here)
        working-directory: ts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./build-darwin-sqlite.sh x64
          cp node_modules/@cutils/sqlite/build-x64/libsqlite3-shim.a \
            node_modules/@cutils/sqlite/build/libsqlite3-shim.a
          SCRIPTC_TARGET=x86_64-apple-macosx14.0.0 \
            scriptc build main-elf.ts \
            --npm-static @cutils/sqlite,@cutils/cli \
            --ffi node_modules/@cutils/sqlite/ffi.json \
            -o "../coordinate-${VERSION}-darwin-x64"

      - name: Verify darwin binaries are Mach-O
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          file "coordinate-${VERSION}-darwin-arm64" | grep -q "Mach-O.*arm64"
          file "coordinate-${VERSION}-darwin-x64" | grep -q "Mach-O.*x86-64"

      - name: Build windows-x64 (cross-compiled, smoked on windows-latest below)
        working-directory: ts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          pnpm add -D @scriptc/runtime-win32-x64-msvc@${{ env.SCRIPTC_VERSION }}
          ./build-win-shim.sh
          OUT="../coordinate-${VERSION}-windows-x64.exe" ./build-win.sh

      - name: Tarballs and checksums
        run: |
          set -euo pipefail
          # tar.gz variants with a bare `coordinate` inside, for mise/ubi-style
          # installers that prefer archives over raw executables
          for f in ./coordinate-*; do
            base="$(basename "$f")"
            if [ "${base%.exe}" = "$base" ]; then
              cp "$f" coordinate
              tar -czf "${f}.tar.gz" coordinate
              rm coordinate
            else
              cp "$f" coordinate.exe
              tar -czf "${f}.tar.gz" coordinate.exe
              rm coordinate.exe
            fi
          done
          sha256sum -- ./coordinate-* > SHA256SUMS-binaries
          # per-asset .sha256 files so install.sh can verify one download
          for f in ./coordinate-*; do
            sha256sum "$f" > "$f.sha256"
          done
          cat SHA256SUMS-binaries
          mkdir -p dist
          mv ./coordinate-* dist/
          mv SHA256SUMS-binaries dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: coordinate-binaries-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

  # The windows spike verdict is conditional go: the exe builds via zig on
  # Linux but nothing ran it. This job is the smoke pass (enqueue, status,
  # daemon claim loop) on a real Windows runner. Windows is best-effort for
  # v0.1.x: the job reports but does not gate the release — only linux+macos
  # binaries are release-blocking.
  windows-smoke:
    name: windows-x64 smoke (best-effort)
    needs: binaries
    continue-on-error: true
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          name: coordinate-binaries-${{ github.ref_name }}
          path: dist

      - name: "Smoke: help, enqueue, daemon claim, events"
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          EXE="dist/coordinate-${VERSION}-windows-x64.exe"
          export COORDINATE_DB="$RUNNER_TEMP/coord-smoke.db"
          "$EXE" --help | grep -q enqueue

          JID=$("$EXE" enqueue --shell -- 'echo hello-from-windows')
          echo "enqueued job $JID"

          # daemon claims and runs cmd jobs; give it a bounded window
          "$EXE" daemon &
          DAEMON_PID=$!
          for i in $(seq 1 30); do
            STATE=$("$EXE" status "$JID" | awk '{print $2}') && [ "$STATE" = done ] && break
            sleep 2
          done
          kill "$DAEMON_PID" 2>/dev/null || true

          STATE=$("$EXE" status "$JID" | awk '{print $2}')
          echo "final state: $STATE"
          "$EXE" events | grep -q '"done"'
          [ "$STATE" = done ]

  release:
    name: attach to the GitHub Release
    needs: binaries
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Download the binaries
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: coordinate-binaries-*
          merge-multiple: true

      - name: Verify binary checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c -- ./SHA256SUMS-binaries
          ls -la

      - name: Attach to the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/SHA256SUMS-binaries
            dist/coordinate-*
          generate_release_notes: true
