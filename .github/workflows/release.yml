name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  SCRIPTC_VERSION: "0.4.16"

jobs:
  # scriptc binaries for the TS port. One ubuntu job cross-compiles the macOS
  # targets with zig (SCRIPTC_TARGET plus the @scriptc/runtime-darwin-arm64
  # pack, per scriptc docs/platforms) so no macOS runners are needed; the
  # darwin binaries are not runnable on Linux, so they only get a file-type
  # check. linux-x64-musl is the --static link. Build commands match the
  # spike (see .agents/docs/ts-port-spike.md, all figures (M) there).
  binaries:
    name: scriptc binaries
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - uses: mlugg/setup-zig@v2

      - name: Install pnpm
        run: corepack enable && corepack prepare pnpm@12.16.1 --activate

      - name: Install scriptc ${{ env.SCRIPTC_VERSION }}
        run: npm install -g scriptc@${{ env.SCRIPTC_VERSION }}

      - name: Install ts dependencies
        working-directory: ts
        run: |
          pnpm add -D @scriptc/runtime-darwin-arm64@${{ env.SCRIPTC_VERSION }}
          pnpm install --frozen-lockfile=false

      - name: Build Linux binaries
        working-directory: ts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          scriptc build main-elf.ts \
            --npm-static @cutils/sqlite,@cutils/cli \
            --ffi node_modules/@cutils/sqlite/ffi.json \
            -o "../coordinate-${VERSION}-linux-x64-gnu"
          scriptc build main-elf.ts \
            --npm-static @cutils/sqlite,@cutils/cli \
            --ffi node_modules/@cutils/sqlite/ffi.json \
            --static \
            -o "../coordinate-${VERSION}-linux-x64-musl"

      - name: Smoke test Linux binaries
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          "./coordinate-${VERSION}-linux-x64-gnu" --help
          "./coordinate-${VERSION}-linux-x64-musl" --help

      - name: Build darwin-arm64 (cross-compiled, not runnable here)
        working-directory: ts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./build-darwin-sqlite.sh arm64
          cp node_modules/@cutils/sqlite/build-arm64/libsqlite3-shim.a \
            node_modules/@cutils/sqlite/build/libsqlite3-shim.a
          SCRIPTC_TARGET=arm64-apple-macosx14.0.0 \
            scriptc build main-elf.ts \
            --npm-static @cutils/sqlite,@cutils/cli \
            --ffi node_modules/@cutils/sqlite/ffi.json \
            -o "../coordinate-${VERSION}-darwin-arm64"

      - name: Build darwin-x64 (cross-compiled, not runnable here)
        working-directory: ts
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ./build-darwin-sqlite.sh x64
          cp node_modules/@cutils/sqlite/build-x64/libsqlite3-shim.a \
            node_modules/@cutils/sqlite/build/libsqlite3-shim.a
          SCRIPTC_TARGET=x86_64-apple-macosx14.0.0 \
            scriptc build main-elf.ts \
            --npm-static @cutils/sqlite,@cutils/cli \
            --ffi node_modules/@cutils/sqlite/ffi.json \
            -o "../coordinate-${VERSION}-darwin-x64"

      - name: Verify darwin binaries are Mach-O
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          file "coordinate-${VERSION}-darwin-arm64" | grep -q "Mach-O.*arm64"
          file "coordinate-${VERSION}-darwin-x64" | grep -q "Mach-O.*x86-64"

      - name: Checksums
        run: |
          sha256sum -- ./coordinate-* > SHA256SUMS-binaries
          cat SHA256SUMS-binaries
          mkdir -p dist
          mv ./coordinate-* dist/
          mv SHA256SUMS-binaries dist/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: coordinate-binaries-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error

  # DISABLED: Windows binaries wait on the scriptc windows spike. The
  # compiler ships a win32-x64-msvc cli package (0.4.16) and the docs say
  # x86_64-windows-gnu cross-compiles with zig from Linux, but
  # @cutils/sqlite is untested there and there is no spike report yet.
  # When spike/windows-spike reports go:
  #   1. uncomment this job, 2. add a build-darwin-sqlite.sh-style zig
  # build of libsqlite3-shim.a for the windows target (or verify
  # @cutils/sqlite ships one), 3. name the artifact
  # coordinate-<ver>-windows-x64.exe, 4. write install.ps1 (see
  # .agents/docs/v0.1.0-release.md for the spec).
  # windows:
  #   name: scriptc binaries (windows-x64)
  #   runs-on: ubuntu-24.04
  #   timeout-minutes: 30
  #   steps:
  #     - uses: actions/checkout@v4
  #     - uses: actions/setup-node@v4
  #       with:
  #         node-version: 24
  #     - uses: mlugg/setup-zig@v2
  #     - run: corepack enable && corepack prepare pnpm@12.16.1 --activate
  #     - run: npm install -g scriptc@${{ env.SCRIPTC_VERSION }}
  #     - working-directory: ts
  #       run: pnpm add -D @scriptc/runtime-windows-x64@${{ env.SCRIPTC_VERSION }} && pnpm install
  #     - working-directory: ts
  #       run: |
  #         VERSION="${GITHUB_REF_NAME#v}"
  #         SCRIPTC_TARGET=x86_64-windows-gnu \
  #           scriptc build main-elf.ts \
  #           --npm-static @cutils/sqlite,@cutils/cli \
  #           --ffi node_modules/@cutils/sqlite/ffi.json \
  #           -o "../coordinate-${VERSION}-windows-x64.exe"
