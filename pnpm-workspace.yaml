# pnpm 12 setting: which dependencies may run their install scripts.
# koffi loads the SQLite shim in the Node test path. esbuild is a docmd build
# dependency. docmd's optional Rust engine stays off, it falls back to its JS engine.
allowBuilds:
  koffi: true
  esbuild: true
  "@docmd/engine-rust": false
patchedDependencies:
  effect@4.1.5: patches/effect@4.1.5.patch
  "@cutils/sqlite@0.8.0": patches/@cutils+sqlite@0.8.0.patch
