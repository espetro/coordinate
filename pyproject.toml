[project]
name = "coordinate"
version = "0.1.0"
description = "Per-machine durable job queue with lease-based concurrency caps"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
coordinate = "coordinate.cli:main"
coordinated = "coordinate.daemon_cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
